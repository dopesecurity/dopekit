version: 2.1
orbs:
  path-filtering: circleci/path-filtering@2.0.4
  continuation: circleci/continuation@2.0.1

setup: true

executors:
  py312:
    docker:
      - image: cimg/python:3.12
    resource_class: small

workflows:
  select-workflow:
    jobs:
      - path-filtering/filter:
          executor: py312
          filters:
            tags:
              only: /PROD_.*/
          # Compare files on main
          base-revision: main
          mapping: |
            .circleci/Dockerfile rebuild_pipeline_image true
            VERSION deploy_service true
          config-path: ".circleci/dynamic_config.yml"
